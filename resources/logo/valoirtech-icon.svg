<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">ValoirTech RGBY Icon</title>
<desc id="desc">Glassmorphism V icon with red, green, blue, and yellow orbit accents.</desc>
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
    <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="vblue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4285F4"/>
    <stop offset="1" stop-color="#0B57D0"/>
  </linearGradient>
  <linearGradient id="vgreen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34A853"/>
    <stop offset="1" stop-color="#137333"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#4285F4" flood-opacity="0.32"/>
  </filter>
</defs>
